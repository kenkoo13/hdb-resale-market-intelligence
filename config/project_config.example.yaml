# Copy to config/project_config.yaml to override defaults (that file is git-ignored).
# All values below are the defaults used by src/config.py when no override exists.
source:
  dataset_id: d_8b84c4ee58e3cfc0ece0d773c8ca6abc
  metadata_url: https://api-production.data.gov.sg/v2/public/api/datasets/{dataset_id}/metadata
  initiate_url: https://api-open.data.gov.sg/v1/public/api/datasets/{dataset_id}/initiate-download
  poll_url: https://api-open.data.gov.sg/v1/public/api/datasets/{dataset_id}/poll-download
http:
  timeout_seconds: 60
  max_retries: 3
  backoff_seconds: 2
  poll_attempts: 10
  poll_interval_seconds: 3
validation:
  # Block the refresh if the new snapshot has fewer rows than this fraction of the previous snapshot.
  min_row_ratio_vs_previous: 0.98
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  curated_dir: data/curated
  outputs_dir: outputs
timezone: Asia/Singapore
random_seed: 42
